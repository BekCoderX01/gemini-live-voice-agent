[project]
name = "gemini-live-voice-agent"
version = "0.1.0"
description = "Real-time voice agent using the Gemini 3.8 Live API and non-blocking function calling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
